name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: backend-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24.14.1
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - run: ruby test/ci-required-contexts.rb

      - name: Install dependencies
        run: npm ci --engine-strict

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --runInBand --no-cache --watchman=false

      - name: E2E tests
        run: npm run test:e2e -- --runInBand

      - name: Build
        run: npm run build

      - name: Validate deployment script
        run: bash test/deploy-release.sh

      - name: Validate Nginx configuration policy
        run: bash test/nginx-config.sh

      - name: Test API CodeDeploy transaction without AWS
        run: bash test/api-codedeploy.sh

      - name: Test versioned publication and packaging
        run: |
          bash test/api-publish.sh
          bash deploy/package-api.sh "$GITHUB_SHA" "$RUNNER_TEMP/api-ci.zip"
          unzip -tq "$RUNNER_TEMP/api-ci.zip"
